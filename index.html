<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AoE2 Matchup Helper</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>AoE2 Matchup Helper</h1>
  <p>Place your civilization and your opponent's on the map, then get a build order and counter recommendation.</p>
</header>

<main>
  <section class="panel">
    <h2>Map</h2>
    <div class="controls-row">
      <label>Map type
        <select id="map-select"></select>
      </label>
      <label>Players
        <select id="slot-count-select"></select>
      </label>
    </div>
    <div class="place-toggle">
      <button type="button" data-marker="you" class="active">Place: You</button>
      <button type="button" data-marker="enemy">Place: Enemy</button>
    </div>
    <div id="map-svg-wrap"></div>
    <p class="map-desc" id="map-desc"></p>
  </section>

  <section class="panel">
    <h2>Civilizations</h2>
    <div class="civ-picker">
      <h3 class="you">Your Civilization</h3>
      <select id="your-civ-select"></select>
      <div class="civ-blurb" id="your-civ-blurb"></div>
    </div>
    <div class="civ-picker">
      <h3 class="enemy">Enemy Civilization</h3>
      <select id="enemy-civ-select"></select>
      <div class="civ-blurb" id="enemy-civ-blurb"></div>
    </div>
    <button id="get-advice" disabled>Get Advice</button>
  </section>

  <section class="panel hidden" id="advice-panel"></section>
</main>

<script src="js/units.js"></script>
<script src="js/civs.js"></script>
<script src="js/maps.js"></script>
<script src="js/advice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
